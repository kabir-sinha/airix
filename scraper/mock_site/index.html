<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>SkyFare — Search Flights</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #f1f5f9; color: #0f172a; }
  header { background: linear-gradient(135deg, #1e3a8a, #2563eb); color: white; padding: 24px 32px; }
  header h1 { font-size: 22px; font-weight: 700; }
  header p { font-size: 13px; opacity: 0.85; margin-top: 4px; }
  main { max-width: 640px; margin: 60px auto; padding: 0 24px; }
  .card { background: white; border-radius: 14px; padding: 32px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
  .card h2 { font-size: 18px; margin-bottom: 20px; }
  .row { display: flex; gap: 16px; margin-bottom: 16px; }
  .field { flex: 1; }
  label { display: block; font-size: 12px; color: #64748b; margin-bottom: 6px; font-weight: 600; }
  select, input {
    width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1;
    border-radius: 8px; font-size: 14px; background: white;
  }
  button {
    width: 100%; margin-top: 8px; background: #2563eb; color: white;
    border: none; padding: 13px; border-radius: 8px; font-size: 15px;
    font-weight: 600; cursor: pointer;
  }
  button:hover { background: #1d4ed8; }
</style>
</head>
<body>

<header>
  <h1>SkyFare</h1>
  <p>Demo flight search site — for scraper testing only, not a real booking site</p>
</header>

<main>
  <div class="card">
    <h2>Search Flights</h2>
    <form id="search-form">
      <div class="row">
        <div class="field">
          <label for="from">FROM</label>
          <select id="from" required>
            <option value="DEL">Delhi (DEL)</option>
            <option value="BOM">Mumbai (BOM)</option>
            <option value="BLR">Bengaluru (BLR)</option>
            <option value="CCU">Kolkata (CCU)</option>
            <option value="HYD">Hyderabad (HYD)</option>
            <option value="MAA">Chennai (MAA)</option>
          </select>
        </div>
        <div class="field">
          <label for="to">TO</label>
          <select id="to" required>
            <option value="BOM">Mumbai (BOM)</option>
            <option value="DEL">Delhi (DEL)</option>
            <option value="BLR">Bengaluru (BLR)</option>
            <option value="CCU">Kolkata (CCU)</option>
            <option value="HYD">Hyderabad (HYD)</option>
            <option value="MAA">Chennai (MAA)</option>
          </select>
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label for="date">DEPARTURE DATE</label>
          <input type="date" id="date" required />
        </div>
        <div class="field">
          <label for="pax">PASSENGERS</label>
          <select id="pax">
            <option>1 Adult</option>
            <option>2 Adults</option>
          </select>
        </div>
      </div>
      <button type="submit">Search Flights</button>
    </form>
  </div>
</main>

<script>
  const dateInput = document.getElementById("date");
  const today = new Date();
  today.setDate(today.getDate() + 30);
  dateInput.value = today.toISOString().split("T")[0];

  document.getElementById("search-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const from = document.getElementById("from").value;
    const to = document.getElementById("to").value;
    const date = document.getElementById("date").value;
    window.location.href = `results.html?from=${from}&to=${to}&date=${date}`;
  });
</script>

</body>
</html>
